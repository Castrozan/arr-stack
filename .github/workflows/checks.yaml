name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - run: nix build --no-link .#checks.x86_64-linux.deployment
      - run: >-
          nix shell --impure --expr
          'let stack = builtins.getFlake ("git+file://" + toString ./.); in stack.inputs.nixpkgs.legacyPackages.x86_64-linux.python3.withPackages (packages: [ packages.pytest packages.pyyaml ])'
          --command python -m pytest nix/modules -q
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --target tests -t arr-stack-tests .
      - run: docker run --rm arr-stack-tests
      - run: docker compose --profile '*' config --quiet
      - run: docker compose -f compose.yaml -f compose.nvidia.yaml config --quiet
      - run: ARR_DATA_DIRECTORY=/tmp docker compose -f compose.yaml -f compose.storage.yaml config --quiet
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash tests/smoke.sh
